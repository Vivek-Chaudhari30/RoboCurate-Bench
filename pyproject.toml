[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurate-bench"
version = "0.0.1"
description = "Placebo-controlled benchmark for robot-data cleaners (episode filters) in simulation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Exact pin (D-001). Extras: aloha = ALOHA sim env (gym-aloha); training/evaluation
    # are needed for `lerobot-train --help` / `lerobot-eval --help` (flag-existence test).
    "lerobot[aloha,training,evaluation]==0.6.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    # Task B (D-030). Authorized exact pins inside lerobot's ranges
    # (METADATA Requires-Dist: diffusers-dep METADATA:92; pusht METADATA:260-262).
    # The eight packages after diffusers are the only new transitives from
    # `pip install --dry-run` of these three into the locked env (nothing upgraded).
    "gym-pusht==0.1.8",
    "pymunk==6.11.1",
    "diffusers==0.39.0",
    "cffi==2.1.1",
    "importlib_metadata==10.2.0",
    "lazy-importer==0.1.0",
    "opencv-python==4.14.0.94",
    "pycparser==3.12",
    "pygame==2.6.1",
    "regex==2026.11.23",
    "shapely==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]
# Wrapped open-source checkers. Pinned exactly; installed into the rcb env on 2026-11-19 and included in
# requirements.lock (the install added only rich, markdown-it-py and mdurl; no version changes).
# Excluded: trajlens 0.4.0 (requires pyarrow<25, lock pins 26.0.1; its PyPI project links a placeholder repo
# github.com/yourusername/trajlens, so the official source cannot be confirmed); retake (the PyPI name is an
# unrelated package; the GitHub tool upgrades numpy/pandas/huggingface_hub/pillow and calls external LLM APIs).
checkers = [
    "lerobot-doctor==0.2.0",
    "kinema==0.1.0",
    "roboaudit==0.3.1",
    "robot-data-audit @ git+https://github.com/liesliy/rda@47c69459e201cdc1f509f84b027c2407ab949e30",
]

[project.scripts]
robocurate = "robocurate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robocurate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: needs a GPU (never run in CPU-only tasks)",
    "slow: takes more than a few seconds",
    "integration: CPU, may use the network (HF Hub) and LeRobot datasets",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures/broken_cleaners"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
