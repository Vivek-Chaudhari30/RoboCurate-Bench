# CPU-only CI: default test suite (no gpu / slow / integration tests) + ruff. No GPU, no secrets, no deploy.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONNOUSERSITE: "1"
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"  # = the dev env (conda rcb)
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Storage env (outside the repo, as CLAUDE.md requires)
        run: |
          echo "ROBOCURATE_SCRATCH=$RUNNER_TEMP/rcb-scratch" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/rcb-scratch/hf" >> "$GITHUB_ENV"
          echo "HF_LEROBOT_HOME=$RUNNER_TEMP/rcb-scratch/lerobot" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rcb-scratch"
      - name: Install (exact lock; CPU torch wheels)
        run: |
          python -m pip install --upgrade pip==25.3
          pip install --no-deps -r requirements.lock --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -e . --no-deps
      - name: Ruff
        run: ruff check .
      - name: Tests (default suite)
        run: pytest -q -m "not gpu and not slow and not integration"
