# RoboCurate-Bench protocol. This file FREEZES at eval-v1 (when src/robocurate/eval/FROZEN is created).
# After that it must never be edited. Values marked TBD depend on GPU calibration (M0) and block result
# runs until measured (D-014). Seed floor per condition: 3 (D-026; D-015's floor of 6 is retired).
eval_seed_start: 100000        # lerobot-eval --seed; episode i uses env seed eval_seed_start + i
calibration_seed_start: 300000 # calibration evals only (D-017); never eval seeds
n_eval_rollouts: 200           # per evaluated checkpoint (CLAUDE.md rule 2)
checkpoint_rule: final         # final checkpoint at the fixed step count only (D-003)
n_train_seeds: TBD             # set by power analysis on M0-measured sigma (D-005), floor 3 (D-026)
train_seeds: TBD
random_subset_seeds: [2000, 2001, 2002]   # placebo subsets (CLAUDE.md rule 1)
curation_seed_range: [500000, 599999]     # env seeds for cleaners that roll out policies; disjoint from eval (D-007)
alpha: 0.05
test: d026_balanced           # D-026 (supersedes D-002/D-016): exact balanced prediction t-test, Holm
tie_break_salt: "46324cdb15ee2629d87e143bdb0d4fe1"   # D-021: selection ties broken by sha256(salt || episode content hash); generated once
weight_permutation_seeds: [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007]   # D-020 weighting-track placebo
max_curation_rollouts: 100     # D-022 per (task, budget, replicate), curation seeds only
